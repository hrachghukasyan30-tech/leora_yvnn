
<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LÈORA YVN | Admin</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;background:#f7f3f0;
 font-family:Arial,sans-serif;color:#222
}
.container{
 max-width:520px;margin:30px auto;padding:24px;
 background:white;border-radius:15px;
 box-shadow:0 4px 15px #0001
}
h2,h3{text-align:center}
input,textarea,button{
 display:block;width:100%;padding:13px;
 margin:10px 0;border-radius:8px;font-size:15px
}
input,textarea{border:1px solid #ddd}
button{
 background:#222;color:white;border:0;
 cursor:pointer
}
button:disabled{opacity:.6}
#dashboard{display:none}
#message,#productMessage{
 text-align:center;overflow-wrap:anywhere
}
.product{
 border:1px solid #ddd;padding:14px;
 margin:12px 0;border-radius:10px
}
.product img{
 max-width:100%;max-height:180px;
 display:block;margin:10px auto
}
.delete{background:#a52a2a}
</style>
</head>
<body>

<div class="container" id="loginBox">
 <h2>LÈORA YVN</h2>
 <h3>Admin Login</h3>
 <input type="email" id="email" placeholder="Email">
 <input type="password" id="password" placeholder="Password">
 <button id="loginBtn">Մուտք գործել</button>
 <p id="message"></p>
</div>

<div class="container" id="dashboard">
 <h2>LÈORA YVN</h2>
 <h3>Admin վահանակ</h3>

 <h3>Ավելացնել ապրանք</h3>
 <input id="name" placeholder="Ապրանքի անունը">
 <input id="price" type="number" min="1" placeholder="Գինը">
 <input id="category" placeholder="Կատեգորիա">
 <textarea id="description" placeholder="Նկարագրություն"></textarea>
 <input id="image_url" type="url" placeholder="Նկարի հղումը">
 <input id="sizes" placeholder="Չափսեր՝ S, M, L">

 <button id="addBtn">Ավելացնել ապրանքը</button>
 <p id="productMessage"></p>

 <hr>
 <h3>Ապրանքների ցանկ</h3>
 <div id="products">Բեռնվում է...</div>

 <button id="logoutBtn">Դուրս գալ</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const message = $('message');
const loginBox = $('loginBox');
const dashboard = $('dashboard');

function showError(error){
 message.textContent = 'Սխալ՝ ' + (error.message || error);
}

if(!window.supabase){
 message.textContent =
 'Supabase-ը չի բեռնվել։ Ստուգիր ինտերնետը։';
 return;
}

const db = window.supabase.createClient(
 'https://nsjgrndgeviravyjjbty.supabase.co',
 'sb_publishable_0-U6deQ9_Gedm4zJ8grLqg_DZpTrNUv'
);

async function loadProducts(){
 const area = $('products');
 area.textContent = 'Բեռնվում է...';

 try{
  const {data,error} = await db
   .from('products')
   .select('*')
   .order('id',{ascending:false});

  if(error) throw error;

  area.replaceChildren();

  if(!data || data.length === 0){
   area.textContent = 'Դեռ ապրանքներ չկան։';
   return;
  }

  data.forEach(p=>{
   const item = document.createElement('div');
   item.className = 'product';

   const title = document.createElement('h4');
   title.textContent = p.name;

   const price = document.createElement('p');
   price.textContent = 'Գին՝ ' + p.price;

   item.append(title,price);

   if(p.image_url){
    const img = document.createElement('img');
    img.src = p.image_url;
    img.alt = p.name;
    item.appendChild(img);
   }

   const del = document.createElement('button');
   del.className = 'delete';
   del.textContent = 'Ջնջել';

   del.onclick = async ()=>{
    if(!confirm('Ջնջե՞լ այս ապրանքը։')) return;

    const {error} = await db
     .from('products')
     .delete()
     .eq('id',p.id);

    if(error){
     alert('Սխալ՝ ' + error.message);
    }else{
     await loadProducts();
    }
   };

   item.appendChild(del);
   area.appendChild(item);
  });

 }catch(error){
  area.textContent = 'Սխալ՝ ' + error.message;
 }
}

async function showDashboard(){
 loginBox.style.display = 'none';
 dashboard.style.display = 'block';
 await loadProducts();
}

$('loginBtn').addEventListener('click',async()=>{
 const button = $('loginBtn');

 message.textContent = 'Ստուգվում է...';
 button.disabled = true;

 try{
  const {data,error} = await db.auth.signInWithPassword({
   email:$('email').value.trim(),
   password:$('password').value
  });

  if(error) throw error;

  if(!data.session){
   throw new Error('Մուտքը չհաստատվեց։');
  }

  await showDashboard();

 }catch(error){
  showError(error);
 }finally{
  button.disabled = false;
 }
});

$('addBtn').addEventListener('click',async()=>{
 const result = $('productMessage');

 const product = {
  name:$('name').value.trim(),
  price:Number($('price').value),
  category:$('category').value.trim(),
  description:$('description').value.trim(),
  image_url:$('image_url').value.trim(),
  sizes:$('sizes').value
   .split(',')
   .map(s=>s.trim())
   .filter(Boolean)
 };

 if(!product.name || !Number.isFinite(product.price) ||
    product.price <= 0){
  result.textContent = 'Լրացրու անունը և ճիշտ գինը։';
  return;
 }

 result.textContent = 'Ավելացվում է...';

 try{
  const {error} = await db
   .from('products')
   .insert(product);

  if(error) throw error;

  result.textContent = 'Ապրանքը ավելացվեց։';

  ['name','price','category','description',
   'image_url','sizes'].forEach(id=>{
    $(id).value = '';
   });

  await loadProducts();

 }catch(error){
  result.textContent = 'Սխալ՝ ' + error.message;
 }
});

$('logoutBtn').addEventListener('click',async()=>{
 const {error} = await db.auth.signOut();

 if(error){
  alert('Սխալ՝ ' + error.message);
  return;
 }

 dashboard.style.display = 'none';
 loginBox.style.display = 'block';
 $('password').value = '';
 message.textContent = 'Դուրս եկար համակարգից։';
});

db.auth.getSession().then(({data,error})=>{
 if(error){
  showError(error);
  return;
 }

 if(data.session){
  showDashboard();
 }
}).catch(showError);

})();
</script>

</body>
</html>
